<title id="t">Man page for raj-learns(7): a process that builds things to understand them. Understanding over memorizing, building over watching, breaking over assuming. Options: --build, --break, --understand, --repeat (default, cannot be disabled). Bugs: reads the RFC instead of the tutorial.</title><desc id="d">Man page for raj-learns(7): a process that builds things to understand them. Understanding over memorizing, building over watching, breaking over assuming. Options: --build, --break, --understand, --repeat (default, cannot be disabled). Bugs: reads the RFC instead of the tutorial.</desc>
