<text class="bar" x="20" y="22">man 7 raj-learns</text>
<text class="bar d" x="880" y="22" text-anchor="end">pager: less</text><text class="t d" x="28" y="64" >RAJ-LEARNS(7)</text>
<text class="t d" x="450" y="64" text-anchor="middle">Misc. Conventions Manual</text>
<text class="t d" x="872" y="64" text-anchor="end">RAJ-LEARNS(7)</text>
<text class="t w b" x="28" y="96" >NAME</text>
<text class="t t" x="62" y="118" >raj-learns - a process that builds things in order to understand them</text>
<text class="t w b" x="28" y="151" >SYNOPSIS</text>
<text class="t" x="62" y="173"><tspan class="w">raj-learns </tspan><tspan class="g">[--build] [--break] [--understand] [--repeat]</tspan></text>
<text class="t w b" x="28" y="206" >DESCRIPTION</text>
<text class="t t" x="62" y="228" >Does not trust an abstraction it has not opened at least once.</text>
<text class="t t" x="62" y="249" >Prefers the source to the summary of the source.</text>
<text class="t t" x="62" y="270" >Trained as a civil engineer: the habit of asking "how does this fail?"</text>
<text class="t t" x="62" y="291" >before "does this work?" carried over intact.</text>
<text class="t w b" x="100" y="322" >understanding</text>
<text class="t a b" x="250" y="322" >&gt;</text>
<text class="t d" x="280" y="322" >memorizing</text>
<text class="t w b" x="100" y="345" >building</text>
<text class="t a b" x="250" y="345" >&gt;</text>
<text class="t d" x="280" y="345" >watching</text>
<text class="t w b" x="100" y="368" >breaking</text>
<text class="t a b" x="250" y="368" >&gt;</text>
<text class="t d" x="280" y="368" >assuming</text>
<text class="t w b" x="28" y="403" >OPTIONS</text>
<text class="t g" x="62" y="425" >--build</text>
<text class="t t" x="230" y="425" >make it work</text>
<text class="t g" x="62" y="447" >--break</text>
<text class="t t" x="230" y="447" >find out why it worked</text>
<text class="t g" x="62" y="469" >--understand</text>
<text class="t t" x="230" y="469" >write down why it broke</text>
<text class="t g" x="62" y="491" >--repeat</text>
<text class="t t" x="230" y="491" >default. cannot be disabled.</text>
<text class="t w b" x="28" y="525" >BUGS</text>
<text class="t t" x="62" y="547" >Reads the RFC instead of the tutorial.</text>
<text class="t t" x="62" y="568" >Says "it depends", then explains exactly what it depends on.</text>
<text class="t w b" x="28" y="601" >SEE ALSO</text>
<text class="t" x="62" y="623"><tspan class="t">nmap(1), prometheus(1), wazuh-agent(8), </tspan><tspan class="a">the-actual-source-code(7)</tspan></text>
