<text class="bar d" x="880" y="22" text-anchor="end">pts/1</text><text class="t" x="28" y="66"><tspan class="g">visitor@github</tspan><tspan class="d">:</tspan><tspan class="w">~</tspan><tspan class="d">$ </tspan><tspan class="w">sudo raj --collaborate</tspan></text>
