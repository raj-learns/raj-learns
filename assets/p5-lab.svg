<text class="t g" x="150" y="176" >open</text>
<text class="t w" x="260" y="176" >grafana</text>
<text class="t t" x="420" y="176" >dashboards (the pretty part)</text>
<text class="t w" x="28" y="198" >8080/tcp</text>
<text class="t g" x="150" y="198" >open</text>
