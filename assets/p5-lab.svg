<text class="t a" x="28" y="316" ># every scan above ran against infrastructure I own. always.</text>
<line x1="28" y1="334" x2="872" y2="334" stroke="#1d2e25" stroke-dasharray="2 5"/><text class="t" x="28" y="346"><tspan class="g">raj@github</tspan><tspan class="d">:</tspan><tspan class="w">~</tspan><tspan class="d">$ </tspan><tspan class="w">python3 -q</tspan></text>
<text class="t d" x="520" y="346" ># ai/ml lab</text>
<text class="t" x="28" y="370"><tspan class="g">&gt;&gt;&gt; </tspan><tspan class="w">frame = cv2.imread("reality.jpg")</tspan></text>
<text class="t" x="28" y="392"><tspan class="g">&gt;&gt;&gt; </tspan><tspan class="w">model.fit(features, labels)</tspan></text>
<text class="t d" x="420" y="392" ># "works on my dataset"</text>
<text class="t" x="28" y="414"><tspan class="g">&gt;&gt;&gt; </tspan><tspan class="w">model.score(train)</tspan></text>
<text class="t d" x="420" y="414" ># flattering</text>
<text class="t" x="28" y="436"><tspan class="g">&gt;&gt;&gt; </tspan><tspan class="w">model.score(unseen)</tspan></text>
<text class="t a" x="420" y="436" ># honest</text>
