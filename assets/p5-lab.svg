<title id="t">Security lab as an nmap scan of raj-learns.local showing wazuh, grafana, zap-proxy, prometheus, alertmanager and greenbone ports open, plus a Python session: model.score(train) is flattering, model.score(unseen) is honest.</title><desc id="d">Security lab as an nmap scan of raj-learns.local showing wazuh, grafana, zap-proxy, prometheus, alertmanager and greenbone ports open, plus a Python session: model.score(train) is flattering, model.score(unseen) is honest.</desc>
