<text class="bar" x="20" y="22">nmap · python3</text>
<text class="bar d" x="880" y="22" text-anchor="end">lab</text><text class="t" x="28" y="66"><tspan class="g">raj@github</tspan><tspan class="d">:</tspan><tspan class="w">~</tspan><tspan class="d">$ </tspan><tspan class="w">nmap -sV raj-learns.local</tspan></text>
<text class="t d" x="520" y="66" ># security lab, self-hosted</text>
<text class="t t" x="28" y="94" >Host is up (0.00012s latency).</text>
<text class="t w b" x="28" y="124" >PORT</text>
<text class="t w b" x="150" y="124" >STATE</text>
<text class="t w b" x="260" y="124" >SERVICE</text>
<text class="t w b" x="420" y="124" >NOTES</text>
<line x1="28" y1="132" x2="872" y2="132" stroke="#2c4a3a"/><rect x="20" y="138" width="860" height="22" fill="#8fe0b0" fill-opacity=".08"><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 44;0 66;0 88;0 110;0 132" calcMode="discrete" dur="4.8999999999999995s" repeatCount="indefinite"/></rect><text class="t w" x="28" y="154" >1514/tcp</text>
