<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">raj-learns — session end</title><desc id="d">A terminal session: exit, connection closed, then pgrep shows raj-learns still running as PID 1.</desc>
<defs><style>
.t{font:14px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;fill:#9db8a8}
.lg{font:30px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;fill:#d9efe1}
.bar{font:12px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;fill:#8fb9a0}
.w{fill:#d9efe1} .d{fill:#587565} .g{fill:#8fe0b0} .a{fill:#e8b04a}
.l{animation:in .01s steps(1) backwards}
.f{animation:fl 1.1s steps(1) backwards}
.c{animation:in .01s steps(1) backwards,bl 1.1s steps(1) infinite}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes fl{0%{opacity:0}10%{opacity:1}18%{opacity:.2}30%{opacity:1}38%{opacity:.55}50%{opacity:1}100%{opacity:1}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.l,.f,.c{animation:none}}
</style>
<filter id="glow" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="3" width="4" height="1" fill="#000" opacity=".30"/></pattern>
<radialGradient id="vig" cx="50%" cy="45%" r="80%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".6"/></radialGradient>
<linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe9d0" stop-opacity="0"/><stop offset=".5" stop-color="#bfe9d0" stop-opacity=".05"/><stop offset="1" stop-color="#bfe9d0" stop-opacity="0"/></linearGradient>
<clipPath id="win"><rect width="900" height="262" rx="10"/></clipPath></defs><g clip-path="url(#win)"><rect width="900" height="262" fill="#070c09"/>
<rect width="900" height="34" fill="#0d1612"/><rect y="34" width="900" height="1" fill="#1d2e25"/>
<text class="bar" x="20" y="22">raj@github: ~</text>
<text class="bar d" x="880" y="22" text-anchor="end">session ending</text><text class="t l" x="28" y="64" style="animation-delay:0.4s" ><tspan class="g">raj@github</tspan><tspan class="d">:</tspan><tspan class="w">~</tspan><tspan class="d">$ </tspan><tspan class="w">exit</tspan></text>
<text class="t l" x="28" y="86" style="animation-delay:1.2s" >logout</text>
<text class="t l" x="28" y="108" style="animation-delay:1.6s" >Connection to github.com closed.</text>
<text class="t l" x="28" y="152" style="animation-delay:2.6s" ><tspan class="g">raj@local</tspan><tspan class="d">:</tspan><tspan class="w">~</tspan><tspan class="d">$ </tspan><tspan class="w">pgrep -a raj-learns</tspan></text>
<text class="t l" x="28" y="174" style="animation-delay:3.3s" ><tspan class="w">1 raj-learns --build --break --understand --repeat</tspan></text>
<text class="t l" x="28" y="196" style="animation-delay:4.1s" ><tspan class="d"># pid 1. kill it and the kernel panics: Attempted to kill init!</tspan></text>
<text class="t l" x="28" y="222" style="animation-delay:5.0s" textLength="109.2" lengthAdjust="spacing"><tspan class="g">raj@local</tspan><tspan class="d">:</tspan><tspan class="w">~</tspan><tspan class="d">$</tspan></text>
<rect class="c" x="146" y="210" width="9" height="16" fill="#e8b04a" style="animation-delay:5s,5s"/><rect y="236" width="900" height="26" fill="#12261c"/><text class="bar" x="20" y="253">[detached]</text><text class="bar" x="880" y="253" text-anchor="end">1 process still running</text><rect y="-80" width="900" height="80" fill="url(#band)"><animateTransform attributeName="transform" type="translate" values="0 0;0 342" dur="8s" repeatCount="indefinite"/></rect>
<rect width="900" height="262" fill="url(#scan)"/><rect width="900" height="262" fill="url(#vig)"/>
<rect x=".5" y=".5" width="899" height="261" rx="10" fill="none" stroke="#24382d"/></g></svg>